<!DOCTYPE html>
<html lang="en">
<!--
Skeleton for a new design system. Copy this folder to systems/<name>/, rename the
title and tokens, then add a card to the root portal (index.html).

Portability note: if this system is meant to be ported into a non-browser UI
runtime, keep the CSS to what that runtime supports. Unity UI Toolkit, for
instance, has no gap, no text-transform, no rem/em and no inherit keyword, so
staying inside that subset makes the port a copy rather than a translation.
-->
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New System</title>
  <link rel="stylesheet" href="css/tokens.css" />
</head>
<body>
  <main class="wrap">
    <h1>New System</h1>
    <p>
      Replace this with the system catalog. The section spine below is from
      STANDARD.md - keep the order, and drop a section only when this system
      genuinely has nothing to put in it.
    </p>

    <!-- 00 MASTHEAD    sticky: section index + theme toggle, nothing else -->
    <!-- 01 THESIS      what this is, and the one or two things to hold on to -->
    <!-- 02 BRIEF       "read this first": the rules an implementer must obey -->
    <!-- 03 COLOUR      every role token, BOTH themes visible at once -->
    <!-- 04 TYPE        every type token, rendered at its real size -->
    <!-- 05 SPACE       spacing scale, measure, breakpoints -->
    <!-- 06 FORM        radii, borders, elevation - the silhouette -->
    <!-- 07 MOTION      durations, easing, what may move and what may not -->
    <!-- 07b SCREEN     optional: an interactive surface treatment. If you add
                        one it must be enhancement-only, read its colours from
                        tokens, stop off screen, and collapse under reduced
                        motion. STANDARD.md section 3. -->
    <!-- 08 COMPONENTS  every component, every state, LIVE -->
    <!-- 09 MOTIFS      the signature shapes -->
    <!-- 10 COMPOSITION the parts assembled into ONE NEUTRAL specimen.
                        Not a product screen with the labels swapped out. -->
    <!-- 11 RULES       do / do not. The refusals matter more. -->

    <p><a href="../../index.html">All design systems</a></p>
  </main>
</body>
</html>
